<svg viewBox="0 0 160 160" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <title>oc-run</title>
  <defs>
    <!-- Deep space gray gradient for a sleek dark mode look -->
    <linearGradient id="bg-black" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>
    <!-- Dark shadow to give depth against any background.
         filter bounds increased to ensure the shadow doesn't clip. -->
    <filter id="shadow-b" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>
  
  <!-- Background Rect with Shadow
       Size unchanged (100x100), but placed inside a larger 160x160 canvas -->
  <rect x="30" y="30" width="100" height="100" rx="22.5" fill="url(#bg-black)" filter="url(#shadow-b)" />
  
  <!-- Subtle inner and outer borders for a glossy tech finish -->
  <rect x="30" y="30" width="100" height="100" rx="22.5" fill="none" stroke="#3F3F46" stroke-width="1" />
  <rect x="31" y="31" width="98" height="98" rx="21.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1" />
  
  <!-- The Speed Glyph -->
  <!-- Proportions restored to the original version -->
  <g transform="translate(50, 50) scale(2.5)" fill="#FFFFFF" fill-rule="evenodd">
    <!-- Main Box -->
    <path d="M2 2h12v20H2zm4 4v12h4V6z" />
    <!-- Speed Lines (Opacity blends beautifully with dark bg) -->
    <path d="M16 4h6v4h-6z" fill-opacity=".3" />
    <path d="M16 10h8v4h-8z" />
    <path d="M16 16h6v4h-6z" fill-opacity=".3" />
  </g>
</svg>
